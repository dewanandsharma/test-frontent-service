<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login</title>
   <link href="assets/img/AIT.png" rel="icon">
  <style>
    * {
      box-sizing: border-box;
    }

.login-container {
  text-align: center; /* This centers inline elements like <img> */
}

.login-container img {
  width: 100px;
  height: 60px;
}


    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
      /* background: linear-gradient(135deg, #4e54c8, #8f94fb); */
      background: #0A1F3D;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-container {
      background-color: white;
      padding: 2rem;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 400px;
    }

    .login-container h2 {
      text-align: center;
      color: #333;
      margin-bottom: 1.5rem;
    }

    .form-group {
      position: relative;
    }

    .login-container input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    .toggle-password {
      position: absolute;
      top: 50%;
      right: 10px;
      transform: translateY(-50%);
      cursor: pointer;
      font-size: 14px;
      color: #555;
    }

    .login-container button {
      width: 100%;
      padding: 12px;
      background-color: #4e54c8;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }

    .login-container button:hover {
      background-color: #3b40a4;
    }

    .error {
      color: red;
      text-align: center;
      margin-top: 10px;
    }

    @media (max-width: 480px) {
      .login-container {
        padding: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <!-- <h2 style="font-size: 60px;">Login In</h2> -->
     <img src="assets/img/AIT.png" />
    <form id="loginForm">
      <div class="form-group">
        <input type="text" id="username" name="username" placeholder="Username" autocomplete="off" required />
      </div>
      <div class="form-group">
        <input type="password" id="password" name="password" placeholder="Password" autocomplete="off" required />
        <span class="toggle-password" onclick="togglePassword()">Show</span>
      </div>
      <button type="submit">Login In</button>
      <div class="error" id="errorMsg"></div>
    </form>
  </div>


<script>
  // Configuration
  const MAX_ATTEMPTS = 3;
  const LOCKOUT_TIME_MS = 30 * 1000; // 30 seconds

  function togglePassword() {
    const passwordInput = document.getElementById("password");
    const toggle = document.querySelector(".toggle-password");

    if (passwordInput.type === "password") {
      passwordInput.type = "text";
      toggle.textContent = "Hide";
    } else {
      passwordInput.type = "password";
      toggle.textContent = "Show";
    }
  }

  // Helper to check and enforce active lockout
  function checkLockout() {
    const errorMsg = document.getElementById("errorMsg");
    const submitBtn = document.querySelector("#loginForm button[type='submit']");
    const lockoutUntil = localStorage.getItem("lockoutUntil");

    if (lockoutUntil) {
      const remainingTime = Math.ceil((parseInt(lockoutUntil, 10) - Date.now()) / 1000);

      if (remainingTime > 0) {
        submitBtn.disabled = true;
        errorMsg.textContent = `Too many failed attempts. Try again in ${remainingTime} seconds.`;
        return true; // Still locked out
      } else {
        // Lockout expired -> reset limits
        localStorage.removeItem("lockoutUntil");
        localStorage.setItem("loginAttempts", "0");
        submitBtn.disabled = false;
        errorMsg.textContent = "";
      }
    }
    return false; // Not locked out
  }

  // Check lockout state on initial page load
  checkLockout();

  document.getElementById("loginForm").addEventListener("submit", function (e) {
    e.preventDefault();

    const errorMsg = document.getElementById("errorMsg");

    // Block submission if currently locked out
    if (checkLockout()) return;

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value.trim();

    const validUsername = "Ankushinfotech";
    const validPassword = "Ankush@2022";

    if (username === validUsername && password === validPassword) {
      // Clear tracking variables on successful login
      localStorage.removeItem("loginAttempts");
      localStorage.removeItem("lockoutUntil");
      sessionStorage.setItem("isLoggedIn", "true");

      errorMsg.textContent = "";
      window.location.href = "admin/admin-analytics.html";
    } else {
      // Increment attempt counter
      let attempts = parseInt(localStorage.getItem("loginAttempts") || "0", 10) + 1;
      localStorage.setItem("loginAttempts", attempts.toString());

      if (attempts >= MAX_ATTEMPTS) {
        const lockoutTime = Date.now() + LOCKOUT_TIME_MS;
        localStorage.setItem("lockoutUntil", lockoutTime.toString());
        checkLockout();

        // Start countdown timer update
        const timer = setInterval(() => {
          if (!checkLockout()) {
            clearInterval(timer);
          }
        }, 1000);
      } else {
        const remaining = MAX_ATTEMPTS - attempts;
        errorMsg.textContent = `Invalid username or password. ${remaining} attempt(s) remaining.`;
      }
    }
  });
</script>


</body>
</html>
